name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main ancestry before loading the release checkout
        shell: bash
        run: |
          test "$(git rev-parse --verify --end-of-options "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          git -c core.hooksPath=/dev/null checkout --detach "$RELEASE_SHA"
      - name: Isolate configuration and state
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/mortis-config" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/mortis-state" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          python-version: '3.15'
          enable-cache: false
      - run: uv sync --locked --group dev
      - name: Check tag, versions and main ancestry
        run: uv run --locked python scripts/release_check.py "$RELEASE_TAG" "$RELEASE_SHA"

  validate:
    name: Validate exact release distributions
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mortis-engine
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Publish validated distributions with attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true

  github-release:
    name: Attach distributions to GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Create release without replacing published assets
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --target "$RELEASE_SHA" --generate-notes
