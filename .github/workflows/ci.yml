name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Isolate local configuration and state
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/mortis-config" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/mortis-state" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Run tests
        run: uv run --locked pytest -q
      - name: Test native parser with its pinned dependencies
        if: matrix.python == '3.13'
        run: >-
          uv run --locked --with-requirements src/mortis_engine/code_graph/requirements.txt
          pytest -q tests/code_graph/test_graph.py::test_native_extractor_retains_real_source_contract
      - name: Lint
        if: matrix.python == '3.15'
        run: uv run --locked ruff check .
      - name: Build wheel and source distribution
        if: matrix.python == '3.15'
        run: uv build
      - name: Check distribution contents
        if: matrix.python == '3.15'
        run: uv run --locked python scripts/check_dist.py
      - name: Smoke test isolated wheel and source installations
        if: matrix.python == '3.15'
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes > "$RUNNER_TEMP/runtime-requirements.txt"
          version=$(uv run --locked python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          for archive in "$GITHUB_WORKSPACE"/dist/*; do
            environment=$(mktemp -d "$RUNNER_TEMP/mortis-installed-XXXXXX")
            uv venv --python 3.15 "$environment"
            uv pip install --python "$environment/bin/python" -r "$RUNNER_TEMP/runtime-requirements.txt" "$archive"
            (cd "$RUNNER_TEMP" && "$environment/bin/python" -I "$GITHUB_WORKSPACE/tests/smoke_test.py" "$version" "$GITHUB_WORKSPACE")
          done
      - name: Upload validated distributions
        if: matrix.python == '3.15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
