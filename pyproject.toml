[project]
name = "mortis-engine"
version = "0.1.0"
description = "Local code analysis with Mortis Engine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = [
  "botocore>=1.39,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "keyring>=25,<26",
  "pydantic>=2.8,<3",
  "rich>=14,<15",
  "tomli-w>=1.2,<2",
]

[project.scripts]
mortis = "mortis_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
