[project]
name = "mortis-engine"
version = "0.1.5"
description = "Review local Git changes and scan repository security with your AI connection"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.16"
authors = [{name = "Code Mortis"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "botocore>=1.39,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "keyring>=25,<26",
  "pydantic>=2.8,<3",
  "rich>=14,<16",
  "tomli-w>=1.2,<2",
]

[project.scripts]
mortis = "mortis_engine.cli:main"

[project.urls]
Homepage = "https://github.com/code-mortis/mortis-engine"
Documentation = "https://github.com/code-mortis/mortis-engine#readme"
Repository = "https://github.com/code-mortis/mortis-engine"
Issues = "https://github.com/code-mortis/mortis-engine/issues"
Changelog = "https://github.com/code-mortis/mortis-engine/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "**/.git", "**/.github", "**/.codex", "**/.local", "**/.venv", "**/reports", "**/dist",
  "**/.env", "**/.env.*", "**/.aws", "**/.pytest_cache", "**/.ruff_cache", "**/__pycache__",
  "**/.coverage", "**/*.pyc", "**/*.pyo", "**/*.db", "**/*.sqlite", "**/*.sqlite3", "**/*.log",
  "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx",
  "**/PLAN.md", "**/REVIEW_IMPROVEMENTS.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mortis_engine"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills/mortis-engine-use" = "mortis_engine/_skill"

[tool.hatch.build.targets.sdist]
include = [
  "/.agents/skills/mortis-engine-use",
  "/src/mortis_engine",
  "/tests",
  "/evals/review_improvements",
  "/docs",
  "/scripts/*.py",
  "/README.md",
  "/LICENSE",
  "/AGENTS.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CHANGELOG.md",
  "/uv.lock",
  "/mortis.toml",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
required-version = ">=0.13.8"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
